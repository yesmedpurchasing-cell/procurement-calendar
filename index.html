<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Procurement team calendar</title>
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FFFFFF;
    --paper-raised:#FFFFFF;
    --surface-muted:#F2F4F6;
    --ink:#13456E;
    --ink-soft:#5B6B72;
    --line:#E4E7EA;
    --line-strong:#C7CDD2;
    --yes-blue:#13456E;
    --light-blue:#049EC8;
    --green:#71A304;
    --light-blue-on-dark:#4AC7E9;
    --green-on-dark:#A1CB45;
    --danger:#A33B3B;
    font-family:'Satoshi', sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;}
  #app{
    background:var(--paper);
    color:var(--ink);
    min-height:100vh;
    padding:20px;
    font-family:'Satoshi', sans-serif;
  }
  .mono{font-family:'IBM Plex Mono', monospace;}
  .btn-label{font-family:'Manrope', sans-serif;font-weight:700;}
  .wrap{max-width:1180px;margin:0 auto;}
  .brand-rule{
    height:3px;
    width:100%;
    margin-bottom:14px;
    background:linear-gradient(90deg, var(--yes-blue), var(--light-blue), var(--green));
  }

  /* header */
  .masthead{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    border-bottom:2px solid var(--yes-blue);
    padding-bottom:12px;
    margin-bottom:18px;
    flex-wrap:wrap;
    gap:10px;
  }
  .wordmark{
    font-family:'Manrope', sans-serif;
    font-weight:700;
    font-size:11px;
    letter-spacing:0.8px;
    color:var(--light-blue);
    margin-bottom:4px;
  }
  .masthead h1{
    font-size:19px;
    font-weight:500;
    margin:0;
    letter-spacing:-0.19px;
    color:var(--ink);
  }
  .masthead .sub{
    font-size:12.5px;
    color:var(--ink-soft);
    margin-top:2px;
  }
  .status-tag{
    font-size:11px;
    color:var(--ink-soft);
    font-family:'IBM Plex Mono', monospace;
  }
  .save-error-tag{
    color:var(--danger);
    font-weight:600;
    text-decoration:underline;
    cursor:pointer;
  }

  .layout{
    display:grid;
    grid-template-columns:220px 1fr;
    gap:22px;
    align-items:start;
  }
  @media (max-width:820px){
    .layout{grid-template-columns:1fr;}
  }

  /* rail */
  .rail-section{margin-bottom:22px;}
  .rail-label{
    font-size:11px;
    color:var(--ink-soft);
    font-weight:600;
    letter-spacing:0.8px;
    margin-bottom:8px;
  }
  .staff-chip{
    display:flex;
    align-items:center;
    gap:8px;
    padding:6px 0;
    border-bottom:1px solid var(--line);
    cursor:pointer;
    user-select:none;
    opacity:1;
    transition:opacity .15s;
  }
  .staff-chip.off{opacity:0.35;}
  .staff-avatar{
    width:22px;height:22px;
    border-radius:50%;
    background:var(--ink);
    color:var(--paper);
    font-size:10px;
    font-weight:600;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
    font-family:'IBM Plex Mono', monospace;
  }
  .staff-name{font-size:12.5px;font-weight:600;line-height:1.2;}
  .staff-role{font-size:10.5px;color:var(--ink-soft);line-height:1.2;}
  .add-staff-btn{
    font-size:11.5px;
    color:var(--ink-soft);
    background:none;
    border:1px dashed var(--line-strong);
    width:100%;
    padding:6px;
    margin-top:6px;
    cursor:pointer;
    font-family:'Satoshi', sans-serif;
  }
  .add-staff-btn:hover{border-color:var(--ink);color:var(--ink);}

  .cat-chip{
    display:flex;
    align-items:center;
    gap:8px;
    padding:5px 0;
    cursor:pointer;
    font-size:12px;
    opacity:1;
  }
  .cat-chip.off{opacity:0.35;}
  .cat-swatch{width:10px;height:10px;flex-shrink:0;}

  /* toolbar */
  .toolbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:12px;
    flex-wrap:wrap;
    gap:10px;
  }
  .month-nav{display:flex;align-items:center;gap:10px;}
  .nav-btn{
    background:var(--paper-raised);
    border:1px solid var(--line-strong);
    width:28px;height:28px;
    cursor:pointer;
    font-size:14px;
    color:var(--ink);
    display:flex;align-items:center;justify-content:center;
  }
  .nav-btn:hover{background:var(--ink);color:var(--paper);}
  .month-title{font-size:16px;font-weight:700;min-width:170px;}
  .today-btn{
    font-size:11.5px;
    background:none;
    border:1px solid var(--line-strong);
    padding:5px 10px;
    cursor:pointer;
    color:var(--ink-soft);
    font-family:'Satoshi', sans-serif;
  }
  .today-btn:hover{border-color:var(--ink);color:var(--ink);}
  .new-btn{
    background:var(--yes-blue);
    color:#fff;
    border:none;
    padding:8px 14px;
    font-size:12.5px;
    font-weight:700;
    cursor:pointer;
    font-family:'Manrope', sans-serif;
  }
  .new-btn:hover{background:var(--light-blue);}

  /* view tabs */
  .view-tabs{
    display:flex;
    gap:4px;
    margin-bottom:12px;
    border-bottom:1px solid var(--line);
  }
  .view-tab{
    font-family:'Satoshi', sans-serif;
    font-size:12.5px;
    font-weight:500;
    color:var(--ink-soft);
    background:none;
    border:none;
    border-bottom:2px solid transparent;
    padding:8px 4px;
    margin-bottom:-1px;
    cursor:pointer;
  }
  .view-tab:hover{color:var(--ink);}
  .view-tab.active{color:var(--yes-blue);border-bottom-color:var(--yes-blue);font-weight:600;}

  /* task list view */
  .stat-row{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:10px;
    margin-bottom:18px;
  }
  @media (max-width:700px){
    .stat-row{grid-template-columns:repeat(2, 1fr);}
  }
  .stat-card{
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:12px;
    padding:14px 16px;
  }
  .stat-card .stat-value{
    font-family:'Manrope', sans-serif;
    font-weight:700;
    font-size:24px;
    color:var(--ink);
    line-height:1.1;
  }
  .stat-card .stat-label{
    font-size:11px;
    color:var(--ink-soft);
    margin-top:4px;
    letter-spacing:0.2px;
  }
  .stat-card.accent-green .stat-value{color:var(--green);}
  .stat-card.accent-danger .stat-value{color:var(--danger);}
  .breakdown-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:16px;
    margin-bottom:20px;
  }
  @media (max-width:700px){
    .breakdown-row{grid-template-columns:1fr;}
  }
  .breakdown-card{
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:12px;
    padding:14px 16px;
  }
  .breakdown-card h3{
    font-size:12px;
    font-weight:600;
    color:var(--ink-soft);
    letter-spacing:0.4px;
    margin:0 0 10px 0;
  }
  .breakdown-item{
    display:flex;
    align-items:center;
    gap:8px;
    padding:5px 0;
    border-bottom:1px solid var(--line);
    font-size:12px;
  }
  .breakdown-item:last-child{border-bottom:none;}
  .breakdown-name{flex:0 0 auto;min-width:78px;font-weight:600;}
  .breakdown-bar-wrap{
    flex:1;
    height:6px;
    background:var(--surface-muted);
    border-radius:3px;
    overflow:hidden;
  }
  .breakdown-bar{height:100%;background:var(--green);border-radius:3px;}
  .breakdown-count{
    flex:0 0 auto;
    font-family:'IBM Plex Mono', monospace;
    color:var(--ink-soft);
    font-size:11px;
    min-width:70px;
    text-align:right;
  }
  .task-table-wrap{
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:12px;
    overflow:hidden;
  }
  .task-table{
    width:100%;
    border-collapse:collapse;
    font-size:12.5px;
  }
  .task-table th{
    text-align:left;
    font-size:10.5px;
    font-weight:600;
    letter-spacing:0.5px;
    color:var(--ink-soft);
    padding:9px 12px;
    border-bottom:1px solid var(--line);
    background:var(--surface-muted);
  }
  .task-table td{
    padding:8px 12px;
    border-bottom:1px solid var(--line);
    vertical-align:middle;
  }
  .task-table tr:last-child td{border-bottom:none;}
  .task-table tr.completed td{color:var(--ink-soft);}
  .task-table tr.completed .task-title{text-decoration:line-through;}
  .task-cat-pill{
    display:inline-flex;
    align-items:center;
    gap:5px;
    font-size:11px;
  }
  .task-cat-swatch{width:8px;height:8px;border-radius:2px;flex-shrink:0;}
  .status-pill{
    display:inline-block;
    font-size:10.5px;
    font-weight:600;
    padding:2px 7px;
    border-radius:20px;
  }
  .status-pill.done{background:rgba(113,163,4,0.14);color:var(--green);}
  .status-pill.overdue{background:rgba(163,59,59,0.12);color:var(--danger);}
  .status-pill.upcoming{background:rgba(4,158,200,0.12);color:var(--light-blue);}
  .empty-state{
    padding:36px 12px;
    text-align:center;
    color:var(--ink-soft);
    font-size:12.5px;
  }

  /* calendar grid */
  .weekday-row{
    display:grid;
    grid-template-columns:repeat(7, minmax(0, 1fr));
    gap:1px;
    border:1px solid transparent;
    box-shadow:0 1px 0 var(--line-strong);
    margin-bottom:6px;
  }
  .weekday-row div{
    font-size:10.5px;
    color:var(--ink-soft);
    font-weight:600;
    padding:4px 6px;
    font-family:'IBM Plex Mono', monospace;
  }
  .month-grid{
    display:grid;
    grid-template-columns:repeat(7, minmax(0, 1fr));
    grid-auto-rows:minmax(96px,auto);
    background:var(--line);
    gap:1px;
    border:1px solid var(--line);
  }
  .day-cell{
    background:var(--paper-raised);
    padding:6px;
    position:relative;
    display:flex;
    flex-direction:column;
    min-height:96px;
    min-width:0;
    overflow:hidden;
  }
  .day-cell.outside{background:var(--surface-muted);}
  .day-cell.today .day-num{
    background:var(--ink);
    color:var(--paper);
  }
  .day-num{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    font-weight:600;
    width:20px;height:20px;
    display:flex;align-items:center;justify-content:center;
    margin-bottom:4px;
  }
  .outside .day-num{color:#B0AC9E;}
  .day-events{
    display:flex;
    flex-direction:column;
    gap:3px;
    overflow:hidden;
    flex:1;
    min-width:0;
  }
  .event-pill{
    font-size:10.5px;
    padding:2px 5px;
    color:#fff;
    cursor:pointer;
    line-height:1.3;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    display:flex;
    align-items:center;
    gap:4px;
    min-width:0;
    width:100%;
  }
  .event-pill .init{
    font-family:'IBM Plex Mono', monospace;
    font-weight:600;
    opacity:0.9;
  }
  .day-add{
    position:absolute;
    top:4px;right:4px;
    font-size:13px;
    color:var(--line-strong);
    cursor:pointer;
    opacity:0;
    transition:opacity .1s;
    font-family:'IBM Plex Mono', monospace;
  }
  .day-cell:hover .day-add{opacity:1;}
  .day-add:hover{color:var(--ink);}

  .event-pill.completed{
    opacity:0.5;
  }
  .event-pill.completed .pill-title{
    text-decoration:line-through;
  }
  .pill-check{
    width:11px;height:11px;
    flex-shrink:0;
    cursor:pointer;
    margin:0;
  }
  .pill-title{
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    min-width:0;
    flex:1;
  }
  .recur-icon{
    font-family:'IBM Plex Mono', monospace;
    opacity:0.85;
    flex-shrink:0;
  }
  .hide-completed-toggle{
    display:flex;
    align-items:center;
    gap:5px;
    font-size:11.5px;
    color:var(--ink-soft);
    cursor:pointer;
    user-select:none;
  }
  .hide-completed-toggle input{margin:0;cursor:pointer;}
  .weekday-picker{display:flex;gap:4px;}
  .weekday-btn{
    width:32px;height:32px;
    border:1px solid var(--line-strong);
    background:var(--paper-raised);
    cursor:pointer;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--ink);
    display:flex;align-items:center;justify-content:center;
  }
  .weekday-btn.selected{background:var(--ink);color:var(--paper);border-color:var(--ink);}
  .weekday-btn.wide{width:auto;padding:0 10px;}

  /* modal */
  .overlay{
    position:fixed;inset:0;
    background:rgba(19,69,110,0.45);
    display:flex;align-items:center;justify-content:center;
    z-index:50;
    padding:16px;
  }
  .modal{
    background:var(--paper-raised);
    width:420px;
    max-width:100%;
    max-height:85vh;
    overflow-y:auto;
    padding:20px;
    border-radius:12px;
    border:1px solid var(--line);
    border-top:3px solid var(--yes-blue);
    box-shadow:0 8px 24px rgba(19,69,110,0.16);
  }
  .modal h2{font-size:15px;font-weight:500;margin:0 0 14px 0;letter-spacing:-0.15px;}
  .field{margin-bottom:12px;}
  .field label{
    display:block;
    font-size:11px;
    color:var(--ink-soft);
    font-weight:600;
    margin-bottom:4px;
  }
  .field input[type=text], .field input[type=date], .field textarea, .field select{
    width:100%;
    padding:7px 8px;
    border:1px solid var(--line-strong);
    background:var(--paper);
    font-size:13px;
    font-family:'Satoshi', sans-serif;
    color:var(--ink);
  }
  .field textarea{resize:vertical;min-height:50px;}
  .cat-options{display:flex;flex-wrap:wrap;gap:6px;}
  .cat-option{
    display:flex;align-items:center;gap:5px;
    padding:5px 8px;
    border:1px solid var(--line-strong);
    font-size:11.5px;
    cursor:pointer;
  }
  .cat-option.selected{border-color:var(--ink);background:var(--surface-muted);font-weight:600;}
  .staff-options{display:flex;flex-direction:column;gap:4px;max-height:150px;overflow-y:auto;}
  .staff-option{
    display:flex;align-items:center;gap:7px;
    font-size:12px;
    padding:3px 0;
    cursor:pointer;
  }
  .staff-option input{margin:0;}
  .modal-actions{
    display:flex;
    justify-content:space-between;
    margin-top:16px;
    gap:8px;
  }
  .btn{
    padding:8px 14px;
    font-size:12.5px;
    font-weight:700;
    cursor:pointer;
    border:1px solid var(--line-strong);
    background:var(--paper-raised);
    font-family:'Manrope', sans-serif;
  }
  .btn.primary{background:var(--yes-blue);color:#fff;border-color:var(--yes-blue);}
  .btn.primary:hover{background:var(--light-blue);border-color:var(--light-blue);}
  .btn.danger{color:var(--danger);border-color:var(--danger);background:none;}
  .btn.danger:hover{background:var(--danger);color:#fff;}
  .btn.plain{border:none;background:none;color:var(--ink-soft);font-family:'Satoshi', sans-serif;font-weight:500;}

  .loading-state{
    padding:60px 0;
    text-align:center;
    color:var(--ink-soft);
    font-size:13px;
    font-family:'IBM Plex Mono', monospace;
  }
  .save-error{
    font-size:11px;
    color:var(--danger);
    margin-top:8px;
  }
</style>

</head>

<div id="app"><div class="loading-state">Loading calendar…</div></div>

<script>
  // If the module script below fails to even start (e.g. blocked by a
  // Content-Security-Policy or network filter), no error reaches the
  // module's own handlers — this plain script always runs first (before
  // the module's imports are even attempted) and reports what happened.
  function showEarlyError(msg){
    const existing = document.getElementById('debug-error-bar');
    if(existing) existing.remove();
    const bar = document.createElement('div');
    bar.id = 'debug-error-bar';
    bar.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:9999;background:#A33B3B;color:#fff;padding:10px 14px;font-family:monospace;font-size:12px;white-space:pre-wrap;word-break:break-word;box-shadow:0 2px 6px rgba(0,0,0,0.3);';
    const dismiss = document.createElement('button');
    dismiss.textContent = 'Dismiss';
    dismiss.style.cssText = 'float:right;background:none;border:1px solid #fff;color:#fff;padding:2px 10px;cursor:pointer;font-size:11px;margin-left:12px;';
    dismiss.onclick = function(){ bar.remove(); };
    bar.appendChild(dismiss);
    bar.appendChild(document.createTextNode(msg));
    document.body.appendChild(bar);
  }
  window.addEventListener('securitypolicyviolation', function(e){
    showEarlyError('Content-Security-Policy blocked a resource: ' + e.blockedURI + ' (directive: ' + e.violatedDirective + ')');
  });
  setTimeout(function(){
    var el = document.getElementById('app');
    if(el && el.textContent.indexOf('Loading calendar') !== -1){
      el.innerHTML = '<div style="padding:40px 20px;max-width:640px;margin:0 auto;font-family:monospace;font-size:13px;line-height:1.6;color:#A33B3B;">'
        + '<strong>The calendar did not start.</strong><br><br>'
        + 'If a red bar appeared above mentioning Content-Security-Policy, that names exactly what got blocked \u2014 send that to me. Otherwise, this usually means the browser could not load a required script from <code>https://www.gstatic.com</code> (Google\'s CDN for the Firebase library), possibly blocked by network security software.<br><br>'
        + 'Things to try:<br>'
        + '&bull; Reload the page (Ctrl+F5)<br>'
        + '&bull; Try it on a different network (home wifi, mobile hotspot) to see if it loads there<br>'
        + '&bull; Ask IT whether <code>www.gstatic.com</code> is blocked or allow-listed on this network'
        + '</div>';
    }
  }, 6000);
</script>

  function fmtDate(dt){
    return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
  }
  function parseDateStr(str){
    const [y,mo,da] = str.split('-').map(Number);
    return new Date(y, mo-1, da);
  }
  function initials(name){
    return name.trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
  }
  function catInfo(id){
    return state.categories.find(c=>c.id===id) || {id, label:'Uncategorised', color:'#8A8A82'};
  }
  function categoryExists(id){ return state.categories.some(c=>c.id===id); }

  const WEEKDAY_NAMES = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const ORDINAL_WORD = {1:'1st',2:'2nd',3:'3rd',4:'4th',5:'5th'};
  function ordinalSuffix(n){
    const s=['th','st','nd','rd'], v=n%100;
    return n+(s[(v-20)%10]||s[v]||s[0]);
  }
  function startOfWeek(date){
    const d = new Date(date.getFullYear(), date.getMonth(), date.getDate() - date.getDay()); // Sunday of that week
    return d;
  }
  function weekdayOccurrenceInfo(dateObj){
    const day = dateObj.getDate();
    const weekday = dateObj.getDay();
    const occurrence = Math.ceil(day/7);
    const daysInMonth = new Date(dateObj.getFullYear(), dateObj.getMonth()+1, 0).getDate();
    const isLast = (day + 7) > daysInMonth;
    return {weekday, occurrence, isLast};
  }
  function monthlyWeekdayLabel(dateObj){
    const {weekday, occurrence, isLast} = weekdayOccurrenceInfo(dateObj);
    const ord = isLast ? 'last' : ORDINAL_WORD[occurrence];
    return `Monthly on the ${ord} ${WEEKDAY_NAMES[weekday]}`;
  }
  function monthlyDateLabel(dateObj){
    return `Monthly on the ${ordinalSuffix(dateObj.getDate())}`;
  }

  // Returns an array of YYYY-MM-DD strings: every date in (year, month) that this event lands on.
  function occurrencesInMonth(event, year, month){
    const repeat = event.repeat || 'none';
    const anchor = parseDateStr(event.date);
    const until = event.repeatUntil ? parseDateStr(event.repeatUntil) : null;
    const daysInMonth = new Date(year, month+1, 0).getDate();
    const results = [];
    function within(d){
      if(d < anchor) return false;
      if(until && d > until) return false;
      return true;
    }
    if(repeat === 'none'){
      if(anchor.getFullYear()===year && anchor.getMonth()===month) results.push(fmtDate(anchor));
      return results;
    }
    if(repeat === 'daily'){
      const interval = Math.max(1, parseInt(event.repeatInterval, 10) || 1);
      for(let day=1; day<=daysInMonth; day++){
        const d = new Date(year, month, day);
        if(!within(d)) continue;
        const daysSince = Math.round((d - anchor) / (24*60*60*1000));
        if(daysSince >= 0 && daysSince % interval === 0) results.push(fmtDate(d));
      }
      return results;
    }
    if(repeat === 'quarterly' || repeat === 'yearly'){
      const monthStep = repeat === 'yearly' ? 12 : 3;
      const anchorMonthIndex = anchor.getFullYear()*12 + anchor.getMonth();
      const thisMonthIndex = year*12 + month;
      const diff = thisMonthIndex - anchorMonthIndex;
      if(diff >= 0 && diff % monthStep === 0){
        const day = Math.min(anchor.getDate(), daysInMonth);
        const d = new Date(year, month, day);
        if(within(d)) results.push(fmtDate(d));
      }
      return results;
    }
    if(repeat === 'weekly'){
      const days = (event.weeklyDays && event.weeklyDays.length) ? event.weeklyDays : [anchor.getDay()];
      const interval = Math.max(1, parseInt(event.repeatInterval, 10) || 1);
      const anchorWeekStart = startOfWeek(anchor);
      for(let day=1; day<=daysInMonth; day++){
        const d = new Date(year, month, day);
        if(!days.includes(d.getDay())) continue;
        if(!within(d)) continue;
        const weeksSince = Math.round((startOfWeek(d) - anchorWeekStart) / (7*24*60*60*1000));
        if(weeksSince >= 0 && weeksSince % interval === 0) results.push(fmtDate(d));
      }
      return results;
    }
    if(repeat === 'monthly_date'){
      const targetDay = anchor.getDate();
      if(targetDay <= daysInMonth){
        const d = new Date(year, month, targetDay);
        if(within(d)) results.push(fmtDate(d));
      }
      return results;
    }
    if(repeat === 'monthly_weekday'){
      const info = weekdayOccurrenceInfo(anchor);
      const weekdays = (event.monthlyWeekdays && event.monthlyWeekdays.length) ? event.monthlyWeekdays : [info.weekday];
      const positions = (event.monthlyPositions && event.monthlyPositions.length) ? event.monthlyPositions : [info.isLast ? 'last' : info.occurrence];
      const found = new Set();
      weekdays.forEach(wd=>{
        const matches = [];
        for(let day=1; day<=daysInMonth; day++){
          const d = new Date(year, month, day);
          if(d.getDay()===wd) matches.push(day);
        }
        positions.forEach(pos=>{
          let day;
          if(pos === 'last') day = matches[matches.length-1];
          else day = matches[pos-1];
          if(day){
            const d = new Date(year, month, day);
            if(within(d)) found.add(fmtDate(d));
          }
        });
      });
      return [...found].sort();
    }
    return results;
  }

  function buildOccurrenceMap(year, month){
    const map = {};
    state.events.forEach(ev=>{
      occurrencesInMonth(ev, year, month).forEach(dateStr=>{
        (map[dateStr] = map[dateStr] || []).push(ev);
      });
    });
    return map;
  }

  // Tries to persist the current state, retrying a few times with backoff
  // before giving up — a single transient server error shouldn't lose an edit.
  async function attemptSave(){
    if(!dbNs) return false;
    const payload = {staff:state.staff, events:state.events, categories:state.categories};
    const backoffs = [400, 1200, 2500];
    for(let attempt=0; attempt<=backoffs.length; attempt++){
      try{
        await dbNs.doc(CALENDAR_DOC).set(payload);
        return true;
      } catch(e){
        console.error('save attempt failed', e);
        showDebugError('Save failed (attempt ' + (attempt+1) + '/' + (backoffs.length+1) + '): ' + (e && e.message ? e.message : String(e)));
        if(attempt < backoffs.length){
          await sleep(backoffs[attempt]);
        }
      }
    }
    return false;
  }

  // Queues saves so rapid changes (e.g. ticking several boxes quickly) collapse
  // into one save of the latest state, instead of firing overlapping requests.
  async function saveData(){
    if(!dbNs){
      saveStatus = 'nosync';
      updateStatusTag();
      return;
    }
    saveQueued = true;
    if(saveInFlight) return;
    saveInFlight = true;
    while(saveQueued){
      saveQueued = false;
      saveStatus = 'saving';
      updateStatusTag();
      const ok = await attemptSave();
      saveStatus = ok ? 'idle' : 'error';
      updateStatusTag();
    }
    saveInFlight = false;
  }

  // Builds the flat, filtered list of occurrences for a given month, applying
  // the same staff/category/hide-completed filters as the calendar view.
  function filteredOccurrencesForMonth(y, m){
    const occMap = buildOccurrenceMap(y, m);
    const rows = [];
    Object.keys(occMap).forEach(dateStr=>{
      occMap[dateStr]
        .filter(e=> !categoryExists(e.category) || state.activeCat.has(e.category))
        .filter(e=> e.staffIds.length===0 || e.staffIds.some(id=>state.activeStaff.has(id)))
        .forEach(e=>{
          const completed = (e.completedDates||[]).includes(dateStr);
          if(state.hideCompleted && completed) return;
          rows.push({event:e, dateStr, completed});
        });
    });
    rows.sort((a,b)=> a.dateStr < b.dateStr ? -1 : a.dateStr > b.dateStr ? 1 : 0);
    return rows;
  }

      }).filter(Boolean).join(', ') || '—';
      const overdueRow = !r.completed && r.dateStr < todayStr;

      const statusHtml = r.completed
        ? '<span class="status-pill done">Completed</span>'
        : overdueRow
          ? '<span class="status-pill overdue">Overdue</span>'
          : upcomingRow
            ? '<span class="status-pill upcoming">Upcoming</span>'

        <td>${escapeHtml(names)}</td>

        <td></td>

      const checkTd = tr.lastElementChild;
      const check = document.createElement('input');
      check.type = 'checkbox';
      check.className = 'pill-check';
      check.checked = r.completed;
      check.onchange = async ()=>{ await toggleComplete(r.event, r.dateStr); render(); };
      checkTd.appendChild(check);
      tr.querySelector('.task-title').style.cursor = 'pointer';
      tr.querySelector('.task-title').onclick = ()=> openModal({mode:'edit', event:r.event, instanceDate:r.dateStr});
      tbody.appendChild(tr);
    });
  }

  function renderGrid(y, m){
    const grid = document.getElementById('month-grid');
    grid.innerHTML = '';
    const firstOfMonth = new Date(y, m, 1);
    let startOffset = firstOfMonth.getDay(); // Sun=0 ... Sat=6, already aligned to Sunday-first columns
    const daysInMonth = new Date(y, m+1, 0).getDate();
    const daysInPrevMonth = new Date(y, m, 0).getDate();
    const totalCells = Math.ceil((startOffset + daysInMonth) / 7) * 7;
    const occMap = buildOccurrenceMap(y, m);

    for(let i=0;i<totalCells;i++){
      const cell = document.createElement('div');
      let cellDate, outside = false;
      if(i < startOffset){
        const day = daysInPrevMonth - startOffset + i + 1;
        cellDate = new Date(y, m-1, day);
        outside = true;
      } else if(i >= startOffset + daysInMonth){
        const day = i - (startOffset + daysInMonth) + 1;
        cellDate = new Date(y, m+1, day);
        outside = true;
      } else {
        const day = i - startOffset + 1;
        cellDate = new Date(y, m, day);
      }
      const dateStr = fmtDate(cellDate);
      cell.className = 'day-cell' + (outside?' outside':'') + (dateStr===todayStr?' today':'');

      const numDiv = document.createElement('div');
      numDiv.className = 'day-num';
      numDiv.textContent = cellDate.getDate();
      cell.appendChild(numDiv);

      const addSpan = document.createElement('div');
      addSpan.className = 'day-add';
      addSpan.textContent = '+';
      addSpan.onclick = ()=> openModal({mode:'new', date: dateStr});
      cell.appendChild(addSpan);

      const evWrap = document.createElement('div');
      evWrap.className = 'day-events';
      (occMap[dateStr] || [])
        .filter(e=> !categoryExists(e.category) || state.activeCat.has(e.category))
        .filter(e=> e.staffIds.length===0 || e.staffIds.some(id=>state.activeStaff.has(id)))
        .filter(e=> !state.hideCompleted || !(e.completedDates||[]).includes(dateStr))
        .forEach(e=>{
          const completed = (e.completedDates||[]).includes(dateStr);
          const pill = document.createElement('div');
          pill.className = 'event-pill' + (completed?' completed':'');
          pill.style.background = catInfo(e.category).color;
          const inits = e.staffIds.map(id=>{
            const s = state.staff.find(x=>x.id===id);
            return s? initials(s.name) : '';
          }).filter(Boolean).join(' ');

          const check = document.createElement('input');
          check.type = 'checkbox';
          check.className = 'pill-check';
          check.checked = completed;
          check.onclick = (ev)=>{ ev.stopPropagation(); };
          check.onchange = async (ev)=>{ ev.stopPropagation(); await toggleComplete(e, dateStr); render(); };
          pill.appendChild(check);

          if(e.repeat && e.repeat !== 'none'){
            const icon = document.createElement('span');
            icon.className = 'recur-icon';
            icon.textContent = '↻';
            pill.appendChild(icon);
          }
          if(inits){
            const initSpan = document.createElement('span');
            initSpan.className = 'init';
            initSpan.textContent = inits;
            pill.appendChild(initSpan);
          }
          const titleSpan = document.createElement('span');
          titleSpan.className = 'pill-title';
          titleSpan.textContent = e.title;
          pill.appendChild(titleSpan);

          pill.onclick = (ev)=>{ ev.stopPropagation(); openModal({mode:'edit', event:e, instanceDate:dateStr}); };
          evWrap.appendChild(pill);
        });
      cell.appendChild(evWrap);
      grid.appendChild(cell);
    }
  }

      });

    }
    refreshCatOptions();

    const dateInput = document.getElementById('f-date');
    const repeatSelect = document.getElementById('f-repeat');
    const repeatUntilWrap = document.getElementById('f-repeat-until-wrap');
    const intervalWrap = document.getElementById('f-interval-wrap');
    const intervalUnitSpan = document.getElementById('f-interval-unit');
    const weekdayPicker = document.getElementById('f-weekdays');
    const monthlyWdWrap = document.getElementById('f-monthlywd-wrap');
    repeatSelect.value = ev.repeat || 'none';

    const WEEKDAY_BTN_ORDER = [
      {label:'Sun', val:0},{label:'Mon', val:1},{label:'Tue', val:2},{label:'Wed', val:3},
      {label:'Thu', val:4},{label:'Fri', val:5},{label:'Sat', val:6}
    ];
    const POSITION_BTN_ORDER = [
      {label:'1st', val:1},{label:'2nd', val:2},{label:'3rd', val:3},{label:'4th', val:4},{label:'Last', val:'last'}
    ];
    function buildToggleButtons(container, options, selectedSet, wide){
      container.innerHTML = '';
      options.forEach(opt=>{
        const btn = document.createElement('div');
        btn.className = 'weekday-btn' + (wide?' wide':'') + (selectedSet.has(opt.val)?' selected':'');
        btn.textContent = wide ? opt.label : opt.label[0];
        btn.title = opt.label;
        btn.onclick = ()=>{
          if(selectedSet.has(opt.val)){
            if(selectedSet.size > 1) selectedSet.delete(opt.val); // always keep at least one selected
          } else {
            selectedSet.add(opt.val);
          }
          btn.classList.toggle('selected', selectedSet.has(opt.val));
        };
        container.appendChild(btn);
      });
    }

    const anchorDateForPickers = ev.date ? parseDateStr(ev.date) : todayReal;
    const anchorInfo = weekdayOccurrenceInfo(anchorDateForPickers);

    const selectedWeekdays = new Set((ev.weeklyDays && ev.weeklyDays.length) ? ev.weeklyDays : [anchorDateForPickers.getDay()]);
    buildToggleButtons(document.getElementById('f-weekdays'), WEEKDAY_BTN_ORDER, selectedWeekdays, false);

    const selectedMonthlyWeekdays = new Set((ev.monthlyWeekdays && ev.monthlyWeekdays.length) ? ev.monthlyWeekdays : [anchorInfo.weekday]);
    buildToggleButtons(document.getElementById('f-monthly-weekdays'), WEEKDAY_BTN_ORDER, selectedMonthlyWeekdays, false);

    const selectedPositions = new Set((ev.monthlyPositions && ev.monthlyPositions.length) ? ev.monthlyPositions : [anchorInfo.isLast ? 'last' : anchorInfo.occurrence]);
    buildToggleButtons(document.getElementById('f-monthly-positions'), POSITION_BTN_ORDER, selectedPositions, true);

    const intervalInput = document.getElementById('f-interval');
    intervalInput.value = ev.repeatInterval || 1;

    function updateRepeatUi(){
      const d = dateInput.value ? parseDateStr(dateInput.value) : null;
      const monthlyDateOpt = repeatSelect.querySelector('option[value="monthly_date"]');
      if(d && monthlyDateOpt) monthlyDateOpt.text = monthlyDateLabel(d);
      const monthlyWdOpt = repeatSelect.querySelector('option[value="monthly_weekday"]');
      if(monthlyWdOpt) monthlyWdOpt.text = 'Monthly on selected weekdays';
      const v = repeatSelect.value;
      repeatUntilWrap.style.display = v === 'none' ? 'none' : 'block';
      intervalWrap.style.display = (v === 'weekly' || v === 'daily') ? 'block' : 'none';
      weekdayPicker.style.display = v === 'weekly' ? 'flex' : 'none';
      intervalUnitSpan.textContent = v === 'daily' ? 'day(s)' : 'week(s), on:';
      monthlyWdWrap.style.display = v === 'monthly_weekday' ? 'block' : 'none';
    }
    updateRepeatUi();
    dateInput.oninput = updateRepeatUi;
    repeatSelect.onchange = updateRepeatUi;

    const staffWrap = document.getElementById('f-staff');
    const selectedStaff = new Set(ev.staffIds || []);
    state.staff.forEach(s=>{
      const label = document.createElement('label');
      label.className = 'staff-option';
      label.innerHTML = `<input type="checkbox" ${selectedStaff.has(s.id)?'checked':''}> ${escapeHtml(s.name)} — ${escapeHtml(s.role)}`;
      label.querySelector('input').onchange = (e)=>{
        if(e.target.checked) selectedStaff.add(s.id); else selectedStaff.delete(s.id);
      };
      staffWrap.appendChild(label);
    });

    document.getElementById('f-cancel').onclick = closeModal;
    if(isEdit){
      document.getElementById('f-delete').onclick = ()=>{
        const msg = (ev.repeat && ev.repeat !== 'none')
          ? 'Delete this whole recurring series? This removes every occurrence, not just this one.'
          : 'Delete this activity?';
        showConfirm(msg, async ()=>{
          state.events = state.events.filter(e=>e.id!==ev.id);
          closeModal();
          await saveData();
        }, ()=> renderModal());
      };
    }
    document.getElementById('f-save').onclick = async ()=>{
      const title = document.getElementById('f-title').value.trim();
      const date = document.getElementById('f-date').value;
      const notes = document.getElementById('f-notes').value.trim();
      const repeat = repeatSelect.value;
      const repeatUntil = document.getElementById('f-repeat-until').value || '';
      const repeatInterval = Math.max(1, parseInt(intervalInput.value, 10) || 1);
      if(!title || !date){
        document.getElementById('f-error').innerHTML = '<div class="save-error">Title and date are required.</div>';
        return;
      }
      const recurrenceFields = {
        repeat, repeatUntil, repeatInterval,
        weeklyDays: [...selectedWeekdays],
        monthlyWeekdays: [...selectedMonthlyWeekdays],
        monthlyPositions: [...selectedPositions]
      };
      if(isEdit){
        const idx = state.events.findIndex(e=>e.id===ev.id);
        state.events[idx] = {...ev, title, date, category:selectedCat, staffIds:[...selectedStaff], notes, ...recurrenceFields, completedDates: ev.completedDates || []};
      } else {
        state.events.push({id:'e'+Date.now(), title, date, category:selectedCat, staffIds:[...selectedStaff], notes, ...recurrenceFields, completedDates:[]});
      }
      closeModal();
      await saveData();
    };
  }

      document.getElementById('cf-remove').onclick = ()=>{
        if(state.categories.length <= 1){
          document.getElementById('cf-error').innerHTML = '<div class="save-error">You need at least one category.</div>';
          return;
        }
        showConfirm('Remove "'+existing.label+'"? Activities already using it stay on the calendar, shown as uncategorized until you re-assign them.', async ()=>{
          state.categories = state.categories.filter(x=>x.id!==existing.id);
          state.activeCat.delete(existing.id);
          closeOverlay();
          await saveData();
          render();
        }, ()=> showCategoryForm(existing));
      };
    }
    document.getElementById('cf-save').onclick = async ()=>{
      const label = document.getElementById('cf-label').value.trim();
      const color = document.getElementById('cf-color').value;
      if(!label){
        document.getElementById('cf-error').innerHTML = '<div class="save-error">Name is required.</div>';
        return;
      }
      if(isEdit){
        existing.label = label;
        existing.color = color;
      } else {
        const id = 'c'+Date.now();
        state.categories.push({id, label, color});
        state.activeCat.add(id);
      }
      closeOverlay();
      await saveData();
      render();
    };
  }
  function openAddCategory(){ showCategoryForm(null); }
  function openEditCategory(c){ showCategoryForm(c); }

  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function escapeAttr(str){ return escapeHtml(str); }

  onAuthStateChanged(auth, (user)=>{
    currentUser = user;
    if(user){
      loadData();
    } else {
      renderLoginScreen();
    }
  });
})();
</script>
</body>
</html>
